<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Thread Writer">
  <rect width="240" height="160" rx="12" fill="#f7f5f2"/>

  <!-- voice dropdown + format tabs -->
  <rect x="16" y="14" width="72" height="16" rx="8" fill="#ffffff" stroke="#e8e3db" stroke-width="1"/>
  <text x="26" y="25.5" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1b1a17">Normies</text>
  <rect x="94" y="14" width="36" height="16" rx="8" fill="#c15f3c"/>
  <text x="102" y="25.5" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#ffffff">Tweet</text>
  <rect x="134" y="14" width="40" height="16" rx="8" fill="#f2e4dc"/>
  <text x="141" y="25.5" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#837c72">Thread</text>

  <!-- stacked tweet cards -->
  <g>
    <rect x="16" y="42" width="208" height="34" rx="10" fill="#ffffff" stroke="#e8e3db" stroke-width="1"/>
    <circle cx="30" cy="59" r="8" fill="#f2e4dc"/>
    <rect x="44" y="52" width="60" height="6" rx="3" fill="#1b1a17"/>
    <rect x="44" y="62" width="150" height="5" rx="2.5" fill="#c9c2b6"/>
  </g>
  <g>
    <rect x="16" y="82" width="208" height="34" rx="10" fill="#ffffff" stroke="#e8e3db" stroke-width="1"/>
    <circle cx="30" cy="99" r="8" fill="#f2e4dc"/>
    <rect x="44" y="92" width="60" height="6" rx="3" fill="#1b1a17"/>
    <rect x="44" y="102" width="164" height="5" rx="2.5" fill="#c9c2b6"/>
  </g>
  <g>
    <rect x="16" y="122" width="208" height="24" rx="10" fill="#ffffff" stroke="#e8e3db" stroke-width="1"/>
    <circle cx="30" cy="134" r="8" fill="#f2e4dc"/>
    <rect x="44" y="131" width="120" height="5" rx="2.5" fill="#c9c2b6"/>
    <rect x="188" y="128" width="24" height="12" rx="6" fill="#c15f3c"/>
  </g>
</svg>
